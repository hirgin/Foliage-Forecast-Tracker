spring:
  application:
    name: foliage-forecast
  datasource:
    # rewriteBatchedStatements is the bulk-load lever on MySQL: it collapses a
    # JDBC batch into multi-row INSERTs. Without it, ingest is an order of
    # magnitude slower. See ADR-0004.
    url: ${FOLIAGE_DB_URL:jdbc:mysql://localhost:3306/foliage?rewriteBatchedStatements=true&connectionTimeZone=UTC&cachePrepStmts=true&useServerPrepStmts=true}
    username: ${FOLIAGE_DB_USER:foliage}
    password: ${FOLIAGE_DB_PASSWORD:foliage}
    hikari:
      # Never block startup on an unreachable database; DatabaseBootstrap
      # reports the failure through /api/v1/meta instead.
      initialization-fail-timeout: -1
      # Fail fast when the database is absent so /api/v1/meta settles in
      # seconds instead of blocking on the 30s default.
      connection-timeout: 5000
      maximum-pool-size: 10
  flyway:
    # Disabled here on purpose -- DatabaseBootstrap runs migrations so that
    # failures degrade rather than abort startup.
    enabled: false

server:
  port: 8080
  compression:
    enabled: true
    mime-types: application/json
    min-response-size: 1024

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

foliage:
  model:
    # Which senescence model scores: "cooling" (ADR-0008, cooling degree days
    # gated by photoperiod) or "photoperiod" (the one it replaces, kept so the
    # two can be compared on identical inputs).
    kind: cooling
  # Bumped for the cooling-degree-day model (ADR-0008). Forecast rows carry
  # this, so a mixed table can be told apart after a partial rescore.
  model-version: "0.2.1-cdd"
  grid:
    # H3 resolution the forecast is computed at (~3 km edge). See ADR-0002.
    resolution: 6
    # A cell counts as forest at or above this canopy percentage. Applied at
    # query time, never at ingest, so it can be retuned without re-sampling --
    # which is exactly what happened here.
    #
    # Lowered from 20. At 20 the map showed colour on 54% of the grid and
    # nothing on the rest, which across the farm belt meant most of the screen
    # had no forecast on it: Ohio scored half its cells, Iowa an eighth. But
    # land with a scattering of trees still turns colour in autumn, and the
    # distribution says the floor was in the wrong place -- 5% scores 73.5% of
    # the grid against 54% at 20, while dropping further to 1% adds only 2.7
    # points more. Nearly everything with any trees on it sits above 5, and
    # nearly nothing sits between 0 and 5.
    #
    # What stays uncoloured after this is genuinely treeless: 38% of Iowa's
    # cells record zero canopy, and no threshold will make row crops turn.
    min-canopy-pct: 5
    # Built-up cells are kept regardless of canopy when they sit in a metro
    # of at least this many people. City street trees turn on the same
    # schedule as the woods outside town, and the canopy floor alone left
    # every city centre off the map -- Boston's own hexagon is 2% canopy.
    # Population rather than a lower canopy floor, because 10% canopy in the
    # west is evergreen pinyon-juniper with no foliage season.
    metro-population: 50000
  terrain:
    # AWS public Terrarium terrain tiles -- keyless, and the reason CONUS
    # elevation is minutes rather than 71 hours: cells are grouped by tile, so
    # under 4,000 fetches cover the country. See TerrainTileElevationSource.
    terrain-tile-url: https://s3.amazonaws.com/elevation-tiles-prod/terrarium
    # A plain CDN read with no per-account metering, so modest parallelism is
    # intended usage. Capped in code at 16.
    terrain-tile-threads: 8
    terrain-tile-zoom: 9
    # Tiles decode to ~13 MB each, so parallelism is bounded by memory rather
    # than by politeness: peak heap is roughly threads x 13 MB.
    canopy-tile-threads: 4
    canopy-url: https://imagery.geoplatform.gov/iipp/rest/services/Vegetation/USFS_EDW_NLCD_TCC_CONUS/ImageServer
    # Points per request. Large enough to keep round trips down, small enough
    # that one failed batch loses little work.
    canopy-batch-size: 250
    # USGS 3DEP, 1 m resolution, batched like the canopy service and not
    # metered by weight. Replaces Open-Meteo, whose 429s were the documented
    # blocker on covering CONUS. See docs/data-sources.md.
    elevation-3dep-url: https://elevation.nationalmap.gov/arcgis/rest/services/3DEPElevation/ImageServer
    # Retained as a fallback implementation; capped at 100 coordinates per call.
    elevation-url: https://api.open-meteo.com/v1/elevation
    # 50 is measured, not guessed. 3DEP is slow when points span many raster
    # tiles -- 0.36 s/point at 50, but 0.73 s/point at both 25 and 100, and
    # CloudFront returns 504 above roughly 200 spread points.
    elevation-batch-size: 50
    boundary-url: https://tigerweb.geo.census.gov/arcgis/rest/services/TIGERweb/State_County/MapServer/0/query
  weather:
    forecast-url: https://api.open-meteo.com/v1/forecast
    archive-url: https://archive-api.open-meteo.com/v1/archive
    # Coordinates per request. Open-Meteo meters by weight, so this trades
    # round trips against how much work a single 429 costs.
    batch-size: 50
    # Open-Meteo's hard cap; forecast_days=17 returns HTTP 400. See ADR-0005.
    forecast-days: 16
    # Trailing observed window pulled alongside the forecast, enough to seed
    # chilling and drought accumulation from the start of the season.
    past-days: 92
    # Years of archive averaged into the climatological fallback.
    # Three rather than five. Each year is a separate archive fetch per cell,
    # so this is a direct 40% cut in the slowest half of the pipeline. The
    # cost is noisier normals: chilling is still computed per year and then
    # averaged, which is what matters, but averaged over fewer years.
    climatology-years: 3
  hrrr:
    # AWS Open Data, no credentials. See ADR-0006.
    base-url: https://noaa-hrrr-bdp-pds.s3.amazonaws.com
    # HRRR reaches 48 h from synoptic cycles and 18 h otherwise, so it refines
    # the recent past and the next couple of days at 3 km. Open-Meteo keeps the
    # 16-day horizon and the climatology.
    enabled: ${FOLIAGE_HRRR_ENABLED:false}
    # A guard, not a preference. Each day is 24 hourly analyses of ~1.2 MB,
    # so ~29 MB per day; 90 days would be 2,160 requests and ~2.5 GB.
    max-days: 5
    # Below this many hours the daily max/min is wrong rather than imprecise,
    # so the day is dropped and Open-Meteo supplies it.
    min-hours-per-day: 18
  places:
    # The full US dump, not a population tier. Foliage destinations are small
    # or unpopulated -- Killington and Grafton record zero -- so places are
    # selected by GeoNames feature code instead. See V8.
    url: https://download.geonames.org/export/dump/US.zip
    batch-size: 2000
  season:
    # Foliage season bounds, month-day. Everything outside this is not modelled.
    #
    # The end was 11-15, which is right for New England and cuts the Gulf
    # states off in the middle of their autumn. Measured against the loaded
    # grid: Louisiana reached peak in 0% of sampled cells and sat at 48%
    # progression on 15 November with 98% of them still climbing; Alabama
    # peaked in 29%, Texas in 37%, and all three were still rising on the last
    # day. A season that ends while half the country is still turning is not a
    # season, it is a window.
    #
    # 12-15 covers them. Deep South foliage runs into early December, and at
    # roughly a point of progression a day Louisiana needs about another month
    # from where 11-15 left it.
    #
    # Florida stays bare and that is not truncation: it sits at 1% progression
    # with no sign of climbing, because subtropical Florida barely turns.
    start: "09-01"
    end: "12-15"
  admin:
    # Guards the pipeline triggers. Off by default, and switched on for the
    # local profile in the block at the end of this file -- which is where it
    # always claimed to be, and was not: the comment said "enabled in the local
    # profile" while nothing enabled it, so every admin call 404'd until
    # someone remembered to export FOLIAGE_ADMIN_ENABLED by hand. The override
    # stays available for CI, which sets it explicitly.
    enabled: ${FOLIAGE_ADMIN_ENABLED:false}
  cors:
    allowed-origins: http://localhost:5173

logging:
  level:
    com.foliage: DEBUG

---
# Local development. The datasource lives in application-local.yml, which is
# gitignored; this holds only what is safe to commit.
spring:
  config:
    activate:
      on-profile: local

foliage:
  admin:
    enabled: true
