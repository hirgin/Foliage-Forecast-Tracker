org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m
org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official

# This build requires a JDK whose cacerts trusts Sectigo Public Server
# Authentication Root R46: NetCDF-Java is published only to Unidata's Maven
# repository, and Oracle's JDK cannot reach it ("PKIX path building failed").
# Temurin works. CI already runs Temurin.
#
# Locally, point Gradle at Temurin from OUTSIDE this file -- an absolute path
# committed here would break every other machine. Put it in your user-level
# ~/.gradle/gradle.properties instead:
#
#   org.gradle.java.home=C:/Program Files/Eclipse Adoptium/jdk-23.0.2.7-hotspot
#
# See docs/adr/0006-grib2.md.
