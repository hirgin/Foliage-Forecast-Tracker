name: Deploy

on:
  push:
    branches: [main]
  schedule:
    # 09:00 UTC daily — after overnight observations have landed upstream.
    # A scheduled run refreshes the data first; a push run only re-exports
    # what is already in the database.
    #
    # The export covers the whole grid, but the nightly refresh is scoped
    # separately: it pulls weather per res 5 parent from an API metered by
    # request weight, and going national unscoped would be 19,904 cells inside
    # a job with a six hour ceiling. Widen REFRESH_STATE as weather lands.
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      refresh:
        description: 'Pull fresh weather and rescore before exporting'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; let a newer commit supersede an in-flight run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '23'

      - uses: gradle/actions/setup-gradle@v4

      # Fail with a readable message rather than a JDBC stack trace 40 lines
      # into a Gradle log. Missing secrets are the likeliest first-run failure.
      - name: Check database secrets are present
        env:
          URL: ${{ secrets.FOLIAGE_DB_URL }}
          USER: ${{ secrets.FOLIAGE_DB_USER }}
          PASSWORD: ${{ secrets.FOLIAGE_DB_PASSWORD }}
        run: |
          missing=""
          [ -n "$URL" ] || missing="$missing FOLIAGE_DB_URL"
          [ -n "$USER" ] || missing="$missing FOLIAGE_DB_USER"
          [ -n "$PASSWORD" ] || missing="$missing FOLIAGE_DB_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            echo "Add them under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          case "$URL" in
            jdbc:mysql://*) ;;
            *) echo "::error::FOLIAGE_DB_URL must start with jdbc:mysql:// (check for stray quotes)"; exit 1 ;;
          esac
          # Shape only -- never the values. A trailing newline from copying
          # out of a file, or a username missing its TiDB cluster prefix, both
          # present as a plain "Access denied".
          echo "url length:      ${#URL}"
          echo "username length: ${#USER}"
          echo "password length: ${#PASSWORD}"
          case "$USER" in
            *.*) echo "username contains a '.' prefix separator: yes" ;;
            *) echo "::warning::username has no '.' -- TiDB Serverless usernames are <prefix>.<user>" ;;
          esac
          for name in URL USER PASSWORD; do
            eval "v=\$$name"
            case "$v" in
              *[[:space:]]) echo "::error::$name has trailing whitespace" ; exit 1 ;;
              [[:space:]]*) echo "::error::$name has leading whitespace" ; exit 1 ;;
            esac
          done
          echo "All three secrets present, URL well-formed."

      # The backend is a batch pipeline, not a server: it boots, exports the
      # season as static JSON, and exits. Nothing is hosted.
      - name: Export forecast data
        working-directory: backend
        env:
          FOLIAGE_DB_URL: ${{ secrets.FOLIAGE_DB_URL }}
          FOLIAGE_DB_USER: ${{ secrets.FOLIAGE_DB_USER }}
          FOLIAGE_DB_PASSWORD: ${{ secrets.FOLIAGE_DB_PASSWORD }}
        run: |
          REFRESH=false
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.refresh }}" = "true" ]; then
            REFRESH=true
          fi
          # States the nightly refresh pulls weather for. The export itself is
          # unscoped and publishes whatever the grid holds; this is only the
          # third-party fetch, which is metered. Widen it as weather lands, and
          # blank it once the country is covered.
          REFRESH_STATE=50
          echo "refresh=$REFRESH scope=${REFRESH_STATE:-whole grid}"
          # Kept on one line: the indented backslash continuations produced
          # runs of whitespace inside --args, which Gradle splits into empty
          # arguments.
          ./gradlew bootRun --no-daemon --stacktrace --args="--foliage.export.path=${{ github.workspace }}/site-data --foliage.export.refresh=$REFRESH --foliage.export.refresh-state=$REFRESH_STATE"

      - name: Check the export produced data
        run: |
          test -f site-data/meta.json || { echo "meta.json missing"; exit 1; }
          COUNT=$(ls site-data/forecast | wc -l)
          echo "exported $COUNT daily files, $(du -sh site-data | cut -f1) total"
          # A season is 76 days; anything much smaller means a partial export,
          # which must not be published over a good one.
          [ "$COUNT" -ge 70 ] || { echo "only $COUNT daily files"; exit 1; }

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_DATA_MODE: static
          BASE_PATH: /${{ github.event.repository.name }}/
        run: |
          npm ci
          npm run build

      - name: Assemble site
        run: |
          cp -r site-data frontend/dist/data
          # Pages runs Jekyll by default, which ignores files beginning with
          # an underscore and would silently drop parts of the build.
          touch frontend/dist/.nojekyll
          du -sh frontend/dist

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
