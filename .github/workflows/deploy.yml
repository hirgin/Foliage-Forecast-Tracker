name: Deploy

on:
  push:
    branches: [main]
  # schedule: PAUSED
  #
  # A scheduled run refreshes weather and rescores before exporting, and
  # rescoring rewrites all 141,274 cells x 106 days -- about 15 million rows --
  # against a metered database whose month's allowance is already spent.
  #
  # The whole block is commented out, key included. Commenting out only the
  # cron entry leaves `schedule:` with nothing under it, which is not valid
  # workflow syntax: GitHub rejects the file, the run fails in zero seconds
  # and is listed under the filename rather than the workflow name, and no
  # deploy happens at all. That is how this was found.
  #
  # To re-enable, uncomment both lines:
  # schedule:
  #   - cron: '0 9 * * *'    # 09:00 UTC, after overnight observations land
  #
  # Manual runs still work through workflow_dispatch below, so refreshing
  # deliberately is unaffected.
  workflow_dispatch:
    inputs:
      refresh:
        description: 'Pull fresh weather and rescore before exporting'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

# Runs queue rather than cancel, because this workflow does two jobs at once
# and they want opposite things. The build step is also the *loader*: it spends
# a slice of the weather API's daily allowance backfilling states, and that
# allowance does not come back. Cancelling an in-flight run to let a newer
# commit through threw away whatever loading it had done and spent the quota
# for nothing -- which happened three times in one afternoon of ordinary
# pushing, each time silently.
#
# Superseding is still right for the *deployment*, so that moved to the deploy
# job below. Builds now queue and run to completion; only the last one to
# finish publishes.
concurrency:
  group: pages-build
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Two commits, so a push can be asked what it actually changed.
          fetch-depth: 2

      # Does this push need the forecast re-exported at all?
      #
      # The export reads every cell for every day of the season -- roughly 15
      # million rows for the daily files and again for the timelines -- and it
      # ran on every push, including the ones that only touched a colour or a
      # label. Eight such deploys in one evening re-read the whole country for
      # changes that did not touch a single row, which is a large share of how
      # a month's database allowance disappeared.
      #
      # Anything under backend/ or .github/ can change what the data says, so
      # those still export. A change confined to frontend/ or docs/ cannot, and
      # rebuilds against the data the last export already published.
      - name: Decide whether the data must be re-exported
        id: plan
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "reason=not a push" >> "$GITHUB_OUTPUT"
            echo "export=true" >> "$GITHUB_OUTPUT"
          elif ! git rev-parse HEAD~1 >/dev/null 2>&1; then
            echo "reason=no parent commit to compare against" >> "$GITHUB_OUTPUT"
            echo "export=true" >> "$GITHUB_OUTPUT"
          else
            CHANGED=$(git diff --name-only HEAD~1 HEAD)
            echo "changed files:"; echo "$CHANGED"
            if echo "$CHANGED" | grep -qE '^(backend/|\.github/)'; then
              echo "reason=backend or workflow changed" >> "$GITHUB_OUTPUT"
              echo "export=true" >> "$GITHUB_OUTPUT"
            else
              echo "reason=frontend or docs only" >> "$GITHUB_OUTPUT"
              echo "export=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      # The last export's output, so a frontend-only build has data to publish
      # without touching the database.
      - name: Reuse the last export
        if: steps.plan.outputs.export == 'false'
        id: reuse
        uses: actions/cache/restore@v4
        with:
          path: site-data
          key: site-data-
          restore-keys: site-data-

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '23'

      - uses: gradle/actions/setup-gradle@v4

      # Fail with a readable message rather than a JDBC stack trace 40 lines
      # into a Gradle log. Missing secrets are the likeliest first-run failure.
      - name: Check database secrets are present
        env:
          URL: ${{ secrets.FOLIAGE_DB_URL }}
          USER: ${{ secrets.FOLIAGE_DB_USER }}
          PASSWORD: ${{ secrets.FOLIAGE_DB_PASSWORD }}
        run: |
          missing=""
          [ -n "$URL" ] || missing="$missing FOLIAGE_DB_URL"
          [ -n "$USER" ] || missing="$missing FOLIAGE_DB_USER"
          [ -n "$PASSWORD" ] || missing="$missing FOLIAGE_DB_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            echo "Add them under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          case "$URL" in
            jdbc:mysql://*) ;;
            *) echo "::error::FOLIAGE_DB_URL must start with jdbc:mysql:// (check for stray quotes)"; exit 1 ;;
          esac
          # Shape only -- never the values. A trailing newline from copying
          # out of a file, or a username missing its TiDB cluster prefix, both
          # present as a plain "Access denied".
          echo "url length:      ${#URL}"
          echo "username length: ${#USER}"
          echo "password length: ${#PASSWORD}"
          case "$USER" in
            *.*) echo "username contains a '.' prefix separator: yes" ;;
            *) echo "::warning::username has no '.' -- TiDB Serverless usernames are <prefix>.<user>" ;;
          esac
          for name in URL USER PASSWORD; do
            eval "v=\$$name"
            case "$v" in
              *[[:space:]]) echo "::error::$name has trailing whitespace" ; exit 1 ;;
              [[:space:]]*) echo "::error::$name has leading whitespace" ; exit 1 ;;
            esac
          done
          echo "All three secrets present, URL well-formed."

      # The backend is a batch pipeline, not a server: it boots, exports the
      # season as static JSON, and exits. Nothing is hosted.
      - name: Export forecast data
        # Skipped only when this push cannot have changed the data *and* the
        # previous export is still available to publish. A cache miss falls
        # through to exporting rather than shipping nothing.
        if: steps.plan.outputs.export == 'true' || steps.reuse.outputs.cache-matched-key == ''
        working-directory: backend
        env:
          FOLIAGE_DB_URL: ${{ secrets.FOLIAGE_DB_URL }}
          FOLIAGE_DB_USER: ${{ secrets.FOLIAGE_DB_USER }}
          FOLIAGE_DB_PASSWORD: ${{ secrets.FOLIAGE_DB_PASSWORD }}
        run: |
          # Refreshing existing states and extending the map are separate
          # jobs with separate budgets, because they compete for one metered
          # allowance and one of them is optional.
          #
          # A scheduled run does both. A push does only the backfill, and a
          # smaller one -- CI runs from a different address than a developer
          # machine, so it has its own allowance, and leaving that unused
          # while the country is 84% grey is waste. Bounded tightly so a
          # deploy still finishes quickly.
          # A push publishes, it does not load.
          #
          # Loading on every deploy was right while the country was mostly
          # grey: the runner has its own API allowance and leaving it unused
          # was waste. All 49 states are loaded now, so what it buys is small
          # and what it costs is not -- a push spent up to 35 minutes
          # backfilling before it published anything, and since runs queue
          # rather than cancel, a few pushes in a row put the site 40 minutes
          # or more behind the code. That is how the site came to be serving a
          # build two commits old while the fix for the very problem being
          # reported sat in a queue.
          #
          # Backfilling now happens on the schedule and on an explicit
          # dispatch, which is where it belongs: it is nightly work, not part
          # of shipping a change.
          REFRESH=false
          BACKFILL_STATES=0
          BACKFILL_MINUTES=0
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.refresh }}" = "true" ]; then
            REFRESH=true
            BACKFILL_STATES=8
            BACKFILL_MINUTES=90
          fi
          # Blank means "every state whose weather is complete", which is what
          # a nightly refresh should mean. It was pinned to Vermont's FIPS back
          # when Vermont was the only state loaded; leaving it that way would
          # have frozen every other state on the day it landed while Vermont
          # alone stayed current. Name a single FIPS here only to override.
          REFRESH_STATE=
          echo "refresh=$REFRESH backfill=${BACKFILL_STATES} states / ${BACKFILL_MINUTES} min"
          # Kept on one line: the indented backslash continuations produced
          # runs of whitespace inside --args, which Gradle splits into empty
          # arguments.
          ./gradlew bootRun --no-daemon --stacktrace --args="--foliage.export.path=${{ github.workspace }}/site-data --foliage.export.refresh=$REFRESH --foliage.export.refresh-state=$REFRESH_STATE --foliage.export.backfill=true --foliage.export.backfill-states=$BACKFILL_STATES --foliage.export.backfill-minutes=$BACKFILL_MINUTES"

      - name: Save the export for the next frontend-only build
        if: steps.plan.outputs.export == 'true' || steps.reuse.outputs.cache-matched-key == ''
        uses: actions/cache/save@v4
        with:
          path: site-data
          key: site-data-${{ github.run_id }}

      - name: Check the data is there and whole
        run: |
          echo "exported=${{ steps.plan.outputs.export }} (${{ steps.plan.outputs.reason }})"
          test -f site-data/meta.json || { echo "meta.json missing"; exit 1; }
          COUNT=$(ls site-data/forecast | wc -l)
          echo "exported $COUNT daily files, $(du -sh site-data | cut -f1) total"
          # A season is 76 days; anything much smaller means a partial export,
          # which must not be published over a good one.
          [ "$COUNT" -ge 70 ] || { echo "only $COUNT daily files"; exit 1; }

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_DATA_MODE: static
          BASE_PATH: /${{ github.event.repository.name }}/
        run: |
          npm ci
          npm run build

      - name: Assemble site
        run: |
          cp -r site-data frontend/dist/data
          # Pages runs Jekyll by default, which ignores files beginning with
          # an underscore and would silently drop parts of the build.
          touch frontend/dist/.nojekyll
          du -sh frontend/dist

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    name: Deploy to Pages
    # Superseding belongs here and not on the build: a queued deployment that
    # has been overtaken has nothing worth finishing, and Pages takes one at a
    # time regardless.
    concurrency:
      group: pages-deploy
      cancel-in-progress: true
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
